# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.skip.metadata.version.check=true -Dkotlin.suppress.incompatible.metadata.version.check=true -Dkotlin.suppress.agp.built.in.kotlin.check=true -Dkotlin.suppress.diagnostic.AGP_WITH_BUILT_IN_KOTLIN_APPLIED=true

# Kotlin settings
kotlin.compiler.languageVersion=1.9
kotlin.compiler.apiVersion=1.9
kotlin.compiler.useK2=false
kotlin.suppress.diagnostic.AGP_WITH_BUILT_IN_KOTLIN_APPLIED=true
kotlin.suppress.diagnostic.AgpWithBuiltInKotlinApplied=true
kotlin.suppress.diagnostics=AGP_WITH_BUILT_IN_KOTLIN_APPLIED
kotlin.suppress.fatal.diagnostics=AGP_WITH_BUILT_IN_KOTLIN_APPLIED,true,all
kotlin.suppress.agp.built.in.kotlin.check=true
kotlin.suppressAgpWithBuiltInKotlinCheck=true
kotlin.internal.suppress.agp.built.in.kotlin.check=true

# AGP settings
android.sourceset.disallowProvider=false

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# AndroidX package structure
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Use this property to specify which architecture you want to build.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
edgeToEdgeEnabled=true

# Enable GIF / webp
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

expo.useLegacyPackaging=false
expo.inlineModules.watchedDirectories=[]

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
AsyncStorage_kspVersion=2.3.7
ksp.useKSP2=true
